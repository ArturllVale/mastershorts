name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: backend
      TESTING: "true"
      CI: "true"
      DATABASE_URL: "file:./ci.db"
      RENDER_SERVICE_URL: "http://localhost:3100"
      LLM_MAX_RETRIES: "0"
      AUTO_HOOK: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -e

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi

          pip install pytest pytest-asyncio

      - name: Verify environment
        run: |
          python --version
          pip --version
          ffmpeg -version
          pytest --version

      - name: Generate Prisma Client & Push Schema
        env:
          DATABASE_URL: "file:./ci.db"
        run: |
          prisma generate --schema=backend/prisma/schema.prisma
          prisma db push --schema=backend/prisma/schema.prisma --accept-data-loss

      - name: Run tests (Ignore DB integration tests if they require a real DB)
        env:
          # Keep minimal env vars that might be required
          TESTING: "true"
          DATABASE_URL: "file:./ci.db"
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend job failed."
            exit 1
          fi

          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Frontend job failed."
            exit 1
          fi

          echo "CI passed successfully."
