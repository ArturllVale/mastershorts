name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install test dependencies
        run: |
          pip install -U pip
          pip install pytest pillow httpx pydantic sqlalchemy numpy opencv-python-headless python-dotenv google-genai fastapi boto3 PyJWT email-validator python-multipart aiofiles prisma nest_asyncio

      - name: Generate Prisma Client (No DB connection needed)
        run: prisma generate --schema=backend/prisma/schema.prisma

      - name: Run tests (Ignore DB integration tests if they require a real DB)
        env:
          # Keep minimal env vars that might be required
          TESTING: "true"
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
