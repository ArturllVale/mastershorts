<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Hex/Rounded Tile -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0d1117" stroke="url(#masterGrad)" stroke-width="2.5" />

  <!-- Stylized Geometric "M" + Play / Short Cut Blade -->
  <g filter="url(#shadow)">
    <!-- Left vertical bar -->
    <path d="M26 70V30C26 27.7909 27.7909 26 30 26C32.2091 26 34 27.7909 34 30V70C34 72.2091 32.2091 74 30 74C27.7909 74 26 72.2091 26 70Z" fill="url(#masterGrad)" />
    
    <!-- Central Peak / Blade pointing to right/play -->
    <path d="M34 33L48 50C49.1 51.4 51.2 51.4 52.3 50L66 33" stroke="url(#innerGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right vertical bar -->
    <path d="M66 70V30C66 27.7909 67.7909 26 70 26C72.2091 26 74 27.7909 74 30V70C74 72.2091 72.2091 74 70 74C67.7909 74 66 72.2091 66 70Z" fill="url(#masterGrad)" />

    <!-- Center Play/Master Bolt Accent -->
    <polygon points="50,47 57,59 51,59 53,69 43,57 49,57" fill="#22d3ee" />
  </g>
</svg>
